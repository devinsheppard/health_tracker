<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Health Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <img src="../../build/icon.svg" alt="" />
        <div>
          <strong>My Health Tracker</strong>
          <span>Personal health dashboard</span>
        </div>
      </div>
      <nav id="nav" aria-label="Primary navigation"></nav>
      <div class="sidebar-footer">
        <div class="privacy-chip">
          <span class="privacy-dot" aria-hidden="true"></span>
          <span><strong id="profileChip">Local profile</strong><small>Private on this device</small></span>
        </div>
        <button id="themeToggle" class="ghost-button theme-button" type="button" aria-label="Toggle light and dark theme">
          <span aria-hidden="true">◐</span><span class="button-label">Toggle theme</span>
        </button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayText"></p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <div class="status-pill" id="saveStatus" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Auto-save ready</span>
          </div>
          <div class="profile-avatar" id="profileAvatar" aria-hidden="true">HT</div>
        </div>
      </header>
      <section id="content"></section>
    </main>

    <template id="metricTemplate">
      <article class="metric">
        <span></span>
        <strong></strong>
        <small></small>
      </article>
    </template>

    <script src="../../node_modules/chart.js/dist/chart.umd.js"></script>
    <script src="../shared/html.js"></script>
    <script src="../shared/planks.js"></script>
    <script src="../shared/calculations.js"></script>
    <script src="../shared/environmental.js"></script>
    <script src="../shared/weight.js"></script>
    <script src="./catalog.js"></script>
    <script src="./labCatalog.js"></script>
    <script src="./trends.js"></script>
    <script src="./ui.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
