<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Health Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <img src="../../build/icon.svg" alt="" />
        <div>
          <strong>My Health Tracker</strong>
          <span id="profileChip">Local SQLite</span>
        </div>
      </div>
      <nav id="nav"></nav>
      <button id="themeToggle" class="ghost-button" type="button">Toggle theme</button>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p id="todayText"></p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="status-pill" id="saveStatus">Auto-save ready</div>
      </header>
      <section id="content"></section>
    </main>

    <template id="metricTemplate">
      <article class="metric">
        <span></span>
        <strong></strong>
        <small></small>
      </article>
    </template>

    <script src="../../node_modules/chart.js/dist/chart.umd.js"></script>
    <script src="../shared/html.js"></script>
    <script src="../shared/planks.js"></script>
    <script src="../shared/calculations.js"></script>
    <script src="../shared/environmental.js"></script>
    <script src="../shared/weight.js"></script>
    <script src="./catalog.js"></script>
    <script src="./labCatalog.js"></script>
    <script src="./trends.js"></script>
    <script src="./ui.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
